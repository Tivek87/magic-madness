// ============================================================================
// MAGIC MADNESS — GRADLE SETTINGS (NEOFORGE 1.21.1)
// ============================================================================

// #region 1. PLUGIN REPOSITORIES
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}
// #endregion

// #region 2. TOOLCHAINS & ROOT PROJECT
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'Magic Madness'
// #endregion
